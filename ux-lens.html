<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UX Workbench — No-Install</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='14' cy='14' r='9' fill='none' stroke='%233B55FA' stroke-width='3'/><line x1='21' y1='21' x2='28' y2='28' stroke='%233B55FA' stroke-width='3' stroke-linecap='round'/></svg>">
<style>
:root {
  --accent-600:#2E44DB; --accent-500:#3B55FA; --accent-050:#EEF1FF;
  --accent-a10:rgba(59,85,250,.10); --accent-a20:rgba(59,85,250,.22);
  --crimson-600:#D92D20; --crimson-700:#B42318; --crimson-050:#FFF3F2; --crimson-a:rgba(217,45,32,.13);
  --cider-600:#E9690C; --cider-700:#C25207; --cider-050:#FEF2E8; --cider-a:rgba(233,105,12,.13);
  --emerald-600:#12A150; --emerald-700:#0E8542; --emerald-050:#EAF8F0;
  --info-700:#0F6FAD; --info-050:#EBF5FC;
  --bg:#F0EFF4; --card:#FFF; --side:#FCFCFD;
  --border:#E7EAF4; --border-strong:#D5DAEC;
  --text:#1B1B20; --text-muted:#55555E; --text-subtle:#8A8A93;
  --r-s:8px; --r-m:12px; --r-l:16px;
  --shadow-low:0 1px 2px rgba(20,20,30,.04),0 4px 14px rgba(20,20,30,.05);
  --shadow-hover:0 2px 6px rgba(20,20,30,.06),0 12px 28px rgba(20,20,30,.10);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"Menlo","Consolas",monospace;
  --ease:cubic-bezier(.3,0,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--card);color:var(--text);font-size:13.5px;line-height:1.5;height:100vh;overflow:hidden}
a{color:var(--accent-600);text-decoration:none}
a:hover{color:var(--accent-500);text-decoration:underline}
.frame{display:grid;grid-template-columns:248px minmax(0,1fr);height:100vh;overflow:hidden}
.sidebar{background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px 14px;min-height:0}
.side-brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:-.02em;padding:0 4px 16px}
.brand-mark{width:28px;height:28px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-500),var(--accent-600));border-radius:9px}
.side-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;min-height:0}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-subtle);padding:14px 10px 6px}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;font-size:13px;font-weight:500;color:var(--text-muted);background:none;border:none;border-radius:9px;padding:8px 10px;cursor:pointer;transition:background .15s var(--ease),color .15s var(--ease)}
.nav-item svg{flex:none;opacity:.8}
.nav-item:hover{background:#F0F2FB;color:var(--text)}
.nav-item.active{background:#E9EEFE;color:var(--text);font-weight:600}
.nav-item.active svg{color:var(--accent-600);opacity:1}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-500)}
.side-foot{padding-top:12px}
.side-chip{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.chip-logo{width:26px;height:26px;flex:none;display:grid;place-items:center;background:var(--accent-050);border-radius:8px}
.chip-name{font-size:12.5px;font-weight:600}
.chip-sub{font-size:10.5px;color:var(--text-subtle)}
.shell{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--card);border-bottom:1px solid var(--border);padding:12px 24px}
.crumbs{font-size:13px;color:var(--text-subtle)}
.crumbs strong{color:var(--text);font-weight:600}
.crumb-sep{margin:0 6px;color:var(--border-strong)}
.pill-badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--accent-600);background:var(--accent-050);border:1px solid var(--accent-a20);border-radius:999px;padding:5px 12px;white-space:nowrap}
.btn-primary,.btn-ghost,.copy-btn{font:inherit;font-weight:600;font-size:13px;border-radius:999px;padding:8px 18px;cursor:pointer;white-space:nowrap;transition:background .15s var(--ease),border-color .15s var(--ease)}
.btn-primary{background:var(--accent-600);color:#fff;border:1px solid var(--accent-600)}
.btn-primary:hover{background:var(--accent-500)}
.btn-primary:disabled{background:#AEBBFD;border-color:#AEBBFD;cursor:default}
.btn-ghost{background:var(--card);color:var(--text);border:1px solid var(--border-strong)}
.btn-ghost:hover{border-color:var(--accent-500);color:var(--accent-600);background:var(--accent-050)}
.copy-btn{width:100%;background:var(--accent-600);color:#fff;border:1px solid var(--accent-600)}
.copy-btn.copied{background:var(--emerald-600);border-color:var(--emerald-600)}
.link-btn{font:inherit;font-size:12.5px;font-weight:600;color:var(--accent-600);background:none;border:none;padding:0;cursor:pointer}
.link-btn:hover{text-decoration:underline}
.error-banner{margin:14px 24px 0;background:var(--crimson-050);border:1px solid rgba(217,45,32,.4);border-radius:var(--r-m);color:var(--crimson-700);padding:11px 16px;font-weight:500}
#main{flex:1;min-height:0;overflow-y:auto;padding:22px 24px 36px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:var(--shadow-low)}
.overline{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)}
.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:2px 0 18px}
.greet h1{font-size:24px;font-weight:700;letter-spacing:-.025em;margin:2px 0 4px}
.greet p{margin:0;color:var(--text-muted)}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;align-items:start}
.ov-card{padding:18px 20px}
.ov-card h2{font-size:14px;font-weight:700;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:9px}
.ov-empty{text-align:center;padding:18px 8px 6px;color:var(--text-muted)}
.ov-empty .btn-ghost{margin-top:14px}
.ov-stats{display:flex;gap:24px;margin:14px 0 4px}
.ov-stat .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.ov-stat .lbl{font-size:11px;color:var(--text-subtle)}
.mini-rings{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 4px}
.mini-ring{display:grid;justify-items:center;gap:3px;width:58px;text-align:center;position:relative}
.mini-ring .mr-val{position:absolute;top:15px;font-family:var(--mono);font-size:11px;font-weight:700}
.mini-ring .mr-lbl{font-size:9.5px;color:var(--text-subtle);line-height:1.2}
.row-list{margin:12px 0 0;display:grid;gap:4px}
.row-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:10px;padding:7px 8px;cursor:pointer;transition:background .12s var(--ease)}
.row-item:hover{background:#F1F4FD}
.row-item .r-main{flex:1;min-width:0}
.row-item .r-url{font-family:var(--mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-item .r-sub{font-size:11px;color:var(--text-subtle)}
.row-item .r-score{font-family:var(--mono);font-weight:700;font-size:14px}
.r-sub{font-size:11px;color:var(--text-subtle)}
.icon-chip{width:24px;height:24px;flex:none;display:inline-grid;place-items:center;border-radius:7px;vertical-align:middle}
.tint-usability{background:#E8EDFE;color:#3B55FA}
.tint-ia{background:#E4F5F2;color:#0D9488}
.tint-hierarchy{background:#FDEFE3;color:#D97706}
.tint-interaction{background:#FCEAF3;color:#DB2777}
.tint-accessibility{background:#E8F7EE;color:#16A34A}
.tint-audit{background:#E8EDFE;color:#3B55FA}
.tint-patterns{background:#FCEAF3;color:#DB2777}
.tint-library{background:#E4F5F2;color:#0D9488}
.tint-top{background:#FDEFE3;color:#D97706}
.setup-card{padding:20px 22px;margin-bottom:14px}
.setup-card h2{font-size:16px;font-weight:700;letter-spacing:-.015em;margin:0 0 2px}
.setup-sub{color:var(--text-muted);font-size:12.5px;margin:0 0 14px}
.steps{counter-reset:st;display:grid;gap:10px;margin:0 0 16px;padding:0;list-style:none}
.steps li{position:relative;padding-left:34px;color:var(--text-muted)}
.steps li strong{color:var(--text)}
.steps li::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:1px;width:22px;height:22px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--accent-600);background:var(--accent-050);border:1px solid var(--accent-a20);border-radius:999px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.cat-card{position:relative;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--border);border-radius:var(--r-m);padding:12px 14px;cursor:pointer;transition:all .15s var(--ease)}
.cat-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-low)}
.cat-card.on{border-color:var(--accent-500);background:var(--accent-050);box-shadow:0 0 0 1px var(--accent-500) inset}
.cat-card .cc-top{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px}
.cat-card .cc-desc{font-size:11.5px;color:var(--text-subtle);margin-top:5px}
.cat-card .cc-check{position:absolute;top:10px;right:10px;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--border-strong);display:grid;place-items:center;color:transparent;font-size:11px;font-weight:800;transition:all .15s var(--ease)}
.cat-card.on .cc-check{background:var(--accent-600);border-color:var(--accent-600);color:#fff}
.run-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.run-hint{font-size:12px;color:var(--text-subtle)}
.paste-zone{width:100%;font-family:var(--mono);font-size:11.5px;color:var(--text);background:var(--bg);border:1.5px dashed var(--border-strong);border-radius:var(--r-m);padding:12px;min-height:84px;resize:vertical}
.paste-zone:focus{outline:none;border-color:var(--accent-500);box-shadow:0 0 0 3px var(--accent-a10)}
.field-label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-subtle);margin:0 0 5px}
.text-input{width:100%;font:inherit;font-size:13px;color:var(--text);background:var(--card);border:1px solid var(--border-strong);border-radius:10px;padding:8px 12px}
.text-input:focus{outline:none;border-color:var(--accent-500);box-shadow:0 0 0 3px var(--accent-a10)}
textarea.text-input{resize:vertical;min-height:56px;border-radius:var(--r-m)}
.view-head{display:flex;align-items:center;gap:28px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:var(--shadow-low);padding:20px 24px;margin-bottom:14px}
.head-meta{flex:1;min-width:240px}
.head-title{font-size:18px;font-weight:700;letter-spacing:-.015em;margin:2px 0}
.head-sub{color:var(--text-muted);font-size:12.5px}
.head-url{font-family:var(--mono);font-size:11.5px;color:var(--text-subtle);word-break:break-all;margin-top:6px}
.head-actions{display:grid;gap:8px;justify-items:end}
.grade{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 12px;border-radius:999px}
.grade.good{background:var(--emerald-050);color:var(--emerald-700)}
.grade.warn{background:var(--cider-050);color:var(--cider-700)}
.grade.bad{background:var(--crimson-050);color:var(--crimson-700)}
.not-run-note{background:var(--info-050);border:1px solid rgba(15,111,173,.25);border-radius:var(--r-m);color:var(--info-700);font-size:12.5px;padding:10px 14px;margin:0 0 14px}
.bento{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.lens-card{text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--border);border-radius:var(--r-l);box-shadow:var(--shadow-low);padding:14px 16px;cursor:pointer;transition:transform .18s var(--ease),box-shadow .18s var(--ease),border-color .18s var(--ease)}
.lens-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.lens-card.filter-on{border-color:var(--accent-500);box-shadow:0 0 0 1px var(--accent-500) inset,var(--shadow-low)}
.lens-card .lc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lens-card .lc-score{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;letter-spacing:-.02em;margin:10px 0 2px}
.lens-card .lc-name{font-weight:600;font-size:13px}
.lens-card .lc-counts{font-size:10.5px;color:var(--text-subtle);margin-top:8px}
.lc-meter{height:4px;border-radius:999px;background:#EBEFFB;margin-top:8px;overflow:hidden}
.lc-meter i{display:block;height:100%;border-radius:999px;transition:width .6s var(--ease)}
.panes{display:grid;grid-template-columns:300px minmax(0,1fr) 340px;gap:12px;align-items:start}
@media (max-width:1160px){.panes{grid-template-columns:1fr}}
.pane-list{padding:8px;max-height:68vh;overflow-y:auto}
.group-head{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 6px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)}
.group-head .group-count{font-family:var(--mono);font-weight:600;letter-spacing:0}
.issue-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer;transition:background .12s var(--ease)}
.issue-item:hover{background:#F1F4FD}
.issue-item.selected{background:var(--accent-050);border-color:var(--accent-500)}
.issue-item .issue-title{font-weight:600;font-size:12.5px}
.issue-item .issue-msg{color:var(--text-muted);font-size:11.5px;margin-top:1px}
.badge{flex:none;margin-top:1px;white-space:nowrap;font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.badge-fail{background:var(--crimson-050);color:var(--crimson-700);border:1px solid rgba(217,45,32,.3)}
.badge-improve{background:var(--cider-050);color:var(--cider-700);border:1px solid rgba(233,105,12,.3)}
.badge-pass{background:var(--emerald-050);color:var(--emerald-700);border:1px solid rgba(18,161,80,.3)}
.list-empty{padding:28px 12px;color:var(--text-subtle);text-align:center}
.pane-shot{overflow:hidden;display:flex;flex-direction:column}
#shotScroll{overflow:auto;max-height:62vh;background:#E7EBF9}
#shotWrap{position:relative;transform-origin:0 0}
#shotImg{display:block}
#overlay{position:absolute;inset:0;pointer-events:none}
#shotWrap iframe{display:block;background:#fff;border:0}
.rect{position:absolute;pointer-events:auto;border:2px solid var(--crimson-600);background:var(--crimson-a);border-radius:4px;cursor:pointer;transition:box-shadow .15s var(--ease)}
.rect.improve{border-color:var(--cider-600);background:var(--cider-a)}
.rect:hover{box-shadow:0 0 0 3px rgba(59,85,250,.35)}
.rect.selected{border-width:3px;box-shadow:0 0 0 4px var(--accent-a20),0 0 0 2px var(--accent-500);z-index:5}
.shot-legend{display:flex;gap:16px;align-items:center;padding:8px 14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text-muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dot-fail{background:var(--crimson-a);border:2px solid var(--crimson-600)}
.dot-improve{background:var(--cider-a);border:2px solid var(--cider-600)}
.legend-hint{margin-left:auto;color:var(--text-subtle)}
.shot-missing{padding:36px 24px;text-align:center;color:var(--text-subtle)}
.pane-detail{padding:16px;max-height:68vh;overflow-y:auto;position:sticky;top:0}
.detail-empty{color:var(--text-subtle);text-align:center;padding:44px 8px}
.detail-rule{font-family:var(--mono);font-size:10.5px;color:var(--text-subtle);font-weight:600;letter-spacing:.04em}
.detail-title{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:6px 0 2px}
.detail-msg{margin:10px 0}
.detail-why{background:var(--info-050);border:1px solid rgba(15,111,173,.22);border-radius:var(--r-s);color:var(--info-700);padding:10px 12px;font-size:12.5px;margin:12px 0}
.detail-selector{font-family:var(--mono);font-size:11px;background:#F0F3FC;border:1px solid var(--border);border-radius:var(--r-s);padding:8px 10px;word-break:break-all;color:var(--text-muted);margin:12px 0}
.prompt-box{font-size:11.5px;color:var(--text-muted);background:var(--bg);border:1px dashed var(--border-strong);border-radius:var(--r-s);padding:10px 12px;margin:12px 0 10px;white-space:pre-wrap}
.manual-card{margin-top:14px;padding:18px 22px}
.manual-card h2{font-size:15px;font-weight:700;margin:0 0 4px}
.manual-sub{color:var(--text-subtle);font-size:12px;margin:0 0 12px}
.manual-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.manual-item{display:flex;gap:10px;align-items:flex-start}
.manual-item input[type=checkbox]{width:15px;height:15px;margin:3px 0 0;accent-color:var(--accent-600);cursor:pointer}
.manual-item label{cursor:pointer}
.manual-item .hint{display:block;color:var(--text-subtle);font-size:11.5px}
.manual-item.checked label{color:var(--text-subtle);text-decoration:line-through}
.manual-item.checked .hint{text-decoration:none}
.pattern-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pattern-card{overflow:hidden}
.pattern-card img{width:100%;height:140px;object-fit:cover;object-position:top left;display:block;border-bottom:1px solid var(--border);background:#E7EBF9}
.pattern-card .p-body{padding:12px 14px}
.pattern-card .p-name{font-weight:600;font-size:13px}
.pattern-card .p-url{font-family:var(--mono);font-size:10.5px;color:var(--text-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 8px}
.lib-card{text-align:left;font:inherit;color:inherit;cursor:pointer;padding:0;transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.lib-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.swatch-strip{display:flex;height:110px;border-bottom:1px solid var(--border)}
.swatch-strip i{flex:1}
.variant-row{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 6px}
.variant-card{width:230px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-m);padding:10px}
.variant-card .measured{font-family:var(--mono);font-size:10.5px;color:var(--text-muted);white-space:pre-wrap;margin-top:6px;line-height:1.6}
.variant-card .v-swatch{height:36px;border-radius:var(--r-s);border:1px solid var(--border);display:grid;place-items:center;font-weight:600;margin-bottom:6px}
.rev-section{border-top:1px solid var(--border);padding:16px 0 4px;margin-top:14px}
.rev-section h3{font-size:13px;font-weight:700;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.rev-section .sec-hint{font-size:11.5px;color:var(--text-subtle);margin:0 0 10px}
.req-badge{font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;background:var(--cider-050);color:var(--cider-700);border:1px solid rgba(233,105,12,.35);border-radius:999px;padding:2px 8px}
.warn-note{background:var(--cider-050);border:1px solid rgba(233,105,12,.35);border-radius:var(--r-s);color:var(--cider-700);font-size:12.5px;padding:9px 12px;margin-top:10px}
.mono-pre{font-family:var(--mono);font-size:11px;background:#F0F3FC;border:1px solid var(--border);border-radius:var(--r-s);padding:10px;overflow-x:auto;white-space:pre-wrap}
.p-name{font-weight:600;font-size:13px}
kbd{font-family:var(--mono);font-size:11px;background:#F0F3FC;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:1px 6px}
.url-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.url-row .url-pill{flex:1;min-width:280px}
.url-pill{display:flex;align-items:center;background:var(--card);border:1px solid var(--border-strong);border-radius:999px;padding:0 6px 0 0}
.url-pill:focus-within{border-color:var(--accent-500);box-shadow:0 0 0 3px var(--accent-a10)}
.url-prefix{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;color:var(--text-subtle);background:var(--bg);border-right:1px solid var(--border);border-radius:999px 0 0 999px;padding:9px 12px 9px 16px}
.url-pill input{flex:1;font:inherit;font-family:var(--mono);font-size:12.5px;color:var(--text);border:none;background:none;padding:9px 12px;min-width:0}
.url-pill input:focus{outline:none}
.meter-row{display:grid;gap:10px;margin-top:14px}
.meter-row .m-item{display:grid;gap:4px}
.meter-row .m-top{display:flex;justify-content:space-between;gap:10px;font-size:12px}
.meter-row .m-top .m-count{font-family:var(--mono);color:var(--text-subtle);font-size:11px;white-space:nowrap}
.meter-row .m-bar{height:5px;border-radius:999px;background:#EBEFFB;overflow:hidden}
.meter-row .m-bar i{display:block;height:100%;border-radius:999px}

var zones={top:{buttons:[],searches:0,fields:[],hasGrid:false},left:{buttons:[],searches:0,fields:[],hasGrid:false},center:{buttons:[],searches:0,fields:[],hasGrid:false},right:{buttons:[],searches:0,fields:[],hasGrid:false},bottom:{buttons:[],searches:0,fields:[],hasGrid:false}};
[].filter.call(document.querySelectorAll('button,[role=button],input[type=button],input[type=submit]'),vis).slice(0,60).forEach(function(b){var t=(txt(b)||b.value||b.getAttribute('aria-label')||'').slice(0,30);if(!t)return;var z=zones[zoneOf(b)];if(z.buttons.length<12&&z.buttons.indexOf(t)<0)z.buttons.push(t);});
[].filter.call(document.querySelectorAll('input:not([type=hidden]):not([type=button]):not([type=submit]):not([type=checkbox]):not([type=radio]),select,textarea'),vis).slice(0,40).forEach(function(f){var z=zones[zoneOf(f)];var ph=(f.getAttribute('placeholder')||'').toLowerCase();if(f.type==='search'||/search|filter|find/.test(ph)){z.searches++;return;}var lab=f.id?document.querySelector('label[for="'+f.id+'"]'):null;if(!lab)lab=f.closest('label');var name=(lab?txt(lab):'')||f.getAttribute('aria-label')||f.getAttribute('placeholder')||f.name||'';if(name&&z.fields.length<10)z.fields.push(name.slice(0,30));});

if(tables.length){var main=tables.map(function(t){var r=t.getBoundingClientRect();return{t:t,area:r.width*r.height};}).sort(function(a,b){return b.area-a.area;})[0].t;
zones[zoneOf(main)].hasGrid=true;
var heads=[].filter.call(main.querySelectorAll('thead th,thead td,[role=columnheader]'),vis);
var rows=[].filter.call(main.querySelectorAll('tbody tr,[role=row]'),function(r){return vis(r)&&!r.querySelector('th,[role=columnheader]');});
var rh=rows.length?Math.round(rows.slice(0,10).reduce(function(s,r){return s+r.getBoundingClientRect().height;},0)/Math.min(rows.length,10)):0;
var sticky=false;var n=heads[0];for(var i=0;i<4&&n;i++){var p=getComputedStyle(n).position;if(p==='sticky'||p==='fixed'){sticky=true;break;}n=n.parentElement;}
var sort=heads.some(function(h){return ['ascending','descending'].indexOf(h.getAttribute('aria-sort'))>=0||h.querySelector('[class*=sort]');});
var rowActions=[];if(rows[0])[].forEach.call(rows[0].querySelectorAll('button,[role=button]'),function(b){var t=(txt(b)||b.getAttribute('aria-label')||'').slice(0,25);if(t&&rowActions.length<6)rowActions.push(t);});
var sel='none';if(rows[0]&&rows[0].querySelector('input[type=checkbox]'))sel='multi';else if(main.querySelector('[aria-selected],.selected,.row-selected'))sel='single';
grid={columnNames:heads.map(txt).filter(Boolean).slice(0,20),columnsVisible:heads.length,rowHeight:rh,stickyHeader:sticky,sortIndicators:sort,selectionMode:sel,rowActions:rowActions};}
/* detail panel: right-zone headings */
var det={exists:false,sections:[]};
[].filter.call(document.querySelectorAll('h1,h2,h3,h4,[class*=section-title],[class*=panel-title]'),vis).forEach(function(h){if(zoneOf(h)!=='right')return;det.exists=true;var t=txt(h).slice(0,40);if(t&&det.sections.length<8&&det.sections.indexOf(t)<0)det.sections.push(t);});

var comps=Object.keys(counts).map(function(t){return{tag:t,count:counts[t]};}).sort(function(a,b){return b.count-a.count;}).slice(0,15);
var out={kind:'uxw-pattern',v:1,url:location.href,capturedOn:new Date().toISOString(),zones:zones,grid:grid,detailPanel:det,components:comps};

<script type="text/plain" id="snip-library">
(async function(){
var base=location.origin;
async function j(u){var r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}
var stories=[];
try{var idx=await j(base+'/index.json');stories=Object.values(idx.entries).filter(function(e){return !e.type||e.type==='story';}).map(function(e){return{id:e.id,title:e.title,name:e.name};});}
catch(e){var v6=await j(base+'/stories.json');stories=Object.values(v6.stories).filter(function(e){return !(e.parameters&&e.parameters.docsOnly);}).map(function(e){return{id:e.id,title:e.kind||e.title,name:e.story||e.name};});}
if(!stories.length){console.log('No stories found.');return;}
console.log('UX Workbench: measuring '+stories.length+' stories…');
var byComp={};var failures=[];
var fr=document.createElement('iframe');fr.style.cssText='position:fixed;left:-2000px;top:0;width:1200px;height:800px;border:0;';document.body.appendChild(fr);
for(var i=0;i<stories.length&&i<150;i++){var st=stories[i];
try{await new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('timeout'));},10000);fr.onload=function(){clearTimeout(t);res();};fr.src=base+'/iframe.html?id='+encodeURIComponent(st.id)+'&viewMode=story';});
await new Promise(function(r){setTimeout(r,400);});
var d=fr.contentDocument;var root=d.querySelector('#storybook-root,#root');var el=root&&(root.firstElementChild||root);
while(el&&el.getBoundingClientRect().width===0&&el.firstElementChild)el=el.firstElementChild;
if(!el)throw new Error('nothing rendered');
var win=fr.contentWindow;
var meas=function(n){var cs=win.getComputedStyle(n);var b=n.getBoundingClientRect();return{backgroundColor:cs.backgroundColor,color:cs.color,fontSize:cs.fontSize,fontFamily:(cs.fontFamily||'').split(',')[0].replace(/"/g,''),height:Math.round(b.height),padding:cs.padding,borderRadius:cs.borderRadius};};
var ce=[el].concat([].slice.call(el.querySelectorAll('*'))).find(function(x){return x.tagName&&x.tagName.indexOf('-')>=0;});
var child=el.querySelector('button,input,select,[role=button]');
(byComp[st.title]=byComp[st.title]||{variants:[],tags:[]});
byComp[st.title].variants.push({name:st.name,storyId:st.id,measured:{root:meas(el),child:child&&child!==el?meas(child):null}});
if(ce)byComp[st.title].tags.push(ce.tagName.toLowerCase());
}catch(e){failures.push({storyId:st.id,error:String(e.message||e).slice(0,80)});}
window.__uxwLibProgress={done:i+1,total:Math.min(stories.length,150)};
if((i+1)%10===0)console.log((i+1)+' of '+stories.length+'…');}
fr.remove();
var comps=Object.keys(byComp).map(function(title){var d=byComp[title];var tc={};d.tags.forEach(function(t){tc[t]=(tc[t]||0)+1;});var tag=Object.keys(tc).sort(function(a,b){return tc[b]-tc[a];})[0]||null;return{title:title,component:title.split('/').pop(),tag:tag,variants:d.variants};});
var out={kind:'uxw-library',v:1,source:base,syncedAt:new Date().toISOString(),components:comps,skipped:failures};
if(window.__UXW_RETURN){window.__uxwResult=out;return comps.length+' components measured.';}
var json=JSON.stringify(out);
try{copy(json);console.log('%cUX Workbench: library copied to clipboard — paste it into the tool. Skipped: '+failures.length,'color:#3B55FA;font-weight:bold');}catch(e){console.log(json);}
try{var b=new Blob([json],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='uxw-library.json';a.click();}catch(e){}
return comps.length+' components measured.';
})();
</script>

<script>

 {id:'ia',name:'Information Architecture',desc:'labels, terminology, grouping, defaults',rules:['A2']},

const lensOfRule={};LENSES.forEach(l=>l.rules.forEach(r=>lensOfRule[r]=l.id));

const RULES={

 A2:{t:'Input without a visible label',w:'Placeholders disappear on input — users forget what a filled field means.',s:'fail'},
 A3:{t:'Text smaller than 12px',w:'Sub-12px text slows scanning and causes misreads of critical figures.',s:'improve'},
 A4:{t:'Keyboard focus not visible',w:"Keyboard users can't see where they are on the screen.",s:'fail'},
 A5:{t:'Element unreachable by keyboard',w:'Keyboard-first users simply cannot operate this control.',s:'fail'},
 A6:{t:'Click target smaller than 24x24px',w:'Small targets cause misclicks — dangerous on trading screens.',s:'improve'},
 A8:{t:'Suspected color-only status signal',w:"Color-blind users (8% of men) can't distinguish red/green-only signals.",s:'improve'},
 T1:{t:'Numeric column not right-aligned',w:"Left-aligned numbers can't be compared by magnitude at a glance.",s:'improve'},
 T2:{t:'Numeric column not using tabular figures',w:'Without tabular figures, digits have uneven widths and rows misalign.',s:'improve'},
 T3:{t:'Truncated cell values',w:'Truncated values can be misread as different (smaller) numbers.',s:'improve'},
 T4:{t:'Low data density (fewer than 15 rows visible)',w:'Fewer visible rows means more scrolling and slower workflows.',s:'improve'},
 T5:{t:'Table header not sticky on scroll',w:'Without a sticky header, users lose track of what columns mean.',s:'improve'},
 T6:{t:'No visible sort indicator',w:"Users can't tell how the data is ordered.",s:'improve'},
 I3:{t:'Destructive button adjacent to primary action',w:'A destructive button beside the primary one invites costly misclicks.',s:'fail'},
 S2:{t:'Empty grid with no empty-state message',w:'An empty grid with no message reads as a bug, not a state.',s:'fail'},
 S1:{t:'Blank page during load',w:'A blank screen makes users think the app is broken.',s:'fail'},
 A7:{t:'Page breaks at 150% zoom',w:'Many users work zoomed; sideways scrolling hides data off-screen.',s:'fail'},
 I1:{t:'Esc does not close the dialog',w:"Esc is the universal 'get me out' — power users expect it.",s:'fail'},
 V1:{t:'Non-library lookalike',w:'Hand-rolled controls drift from the design system and double the maintenance cost.',s:'improve'},
 V2:{t:'Off-library styling',w:'Overridden styles silently fork the design system, one screen at a time.',s:'improve'}
};
const PROMPTS={
 A1:'In the Angular component for this screen, the text at selector "{selector}" has a contrast ratio of {ratio}:1 ({fg} on {bg}), below the WCAG AA minimum. Adjust the text or background color to reach at least 4.5:1 while staying close to the current palette. Do not change font size, weight, or layout.',
 A2:'The form field at selector "{selector}" has no visible label{placeholderNote}. Add a visible <label> (or mat-label) associated with the field via for/id, positioned above the field. Keep the placeholder only as an example value, never as the label. Do not change the field\'s behavior.',
 A3:'The text at selector "{selector}" is {fontSize} — below the 12px minimum for dense data screens. Increase it to at least 12px, keeping the type hierarchy consistent with sibling text. Do not change layout or truncate content.',
 A4:'The focusable element at selector "{selector}" ({elementText}) shows no visible change when it receives keyboard focus. Add a clearly visible focus style via :focus-visible, e.g. outline: 2px solid the app\'s focus color with outline-offset: 2px. Apply it consistently to all interactive elements on this screen.',
 A5:'The clickable element at selector "{selector}" ({elementText}) cannot be reached with the keyboard. If it is a custom control, add tabindex="0", an appropriate role, and a keydown handler for Enter/Space — or better, replace it with a native <button>. Do not change its visual appearance.',
 A6:'The click target at selector "{selector}" ({elementText}) is {width}x{height}px — below the 24x24px minimum. Increase its clickable area to at least 24x24px (padding or min-width/min-height on the interactive element itself) without shifting surrounding layout.',
 A8:'The element at selector "{selector}" appears to signal status using color alone ({color}). Add a non-color cue: an icon plus a text label or tooltip, so the state is understandable to color-blind users. Keep the existing colors.',
 T1:'In the Angular component for this screen, the numeric column "{columnName}" (selector: {selector}) is {align}-aligned. Right-align it and apply font-variant-numeric: tabular-nums. Apply the same to all numeric columns. Do not change column order or row heights.',
 T2:'The numeric column "{columnName}" (selector: {selector}) does not use tabular figures, so digits have uneven widths and misalign vertically. Apply font-variant-numeric: tabular-nums (or font-feature-settings: "tnum") to all numeric cells in this grid. Do not change fonts or sizes otherwise.',
 T3:'Cell values in this grid are truncated (example: selector {selector}, content "{content}"). Give affected columns enough width, and add a tooltip with the full value on hover (title attribute or matTooltip). Keep text-overflow: ellipsis as the visual treatment. Do not reduce font size.',
 T4:'The main data grid on this screen shows only {rowsVisible} rows in the viewport (row height ≈ {rowHeight}px). Users of dense financial grids need at least 15 visible rows. Reduce vertical padding in cells and the header, target a row height of ~28-32px, and remove non-essential vertical whitespace above the grid. Do not remove columns.',
 T5:'The header of the grid at selector "{selector}" scrolls out of view with the rows. Make it sticky: position: sticky; top: 0 on the header row (with an opaque background and a z-index above the rows), or enable the grid library\'s fixed-header option. Do not change column widths.',
 T6:'No visible sort indicator was detected on the grid at selector "{selector}". Add aria-sort="ascending"/"descending" to the sorted column header and render a visible arrow icon in it. Ensure clicking a header updates both the order and the indicator.',
 I3:'The destructive button "{destructiveText}" (selector: {selector}) sits only {gap}px from the primary action "{primaryText}". Separate them by at least 16px, or move the destructive action to the opposite side or into an overflow menu. Style it as a danger/secondary variant, never adjacent to and matching the primary.',

 A7:'At 150% browser zoom this screen overflows horizontally ({scrollWidth}px of content in a {clientWidth}px viewport), forcing sideways scrolling. Make the layout reflow at higher zoom: use flexible widths (%, fr, minmax), let the main grid scroll inside its own container, and avoid fixed pixel widths on page-level containers.',

 const card=el('div','card setup-card');

/* ---------- embedded engine (http mode: same-origin iframe automation) ---------- */
function normUrl(u){
 u=(u||'').trim();if(!u)return null;
 if(u.startsWith('/'))return u;
 try{const p=new URL(u);
  if(p.origin!==location.origin)return{err:'That screen is on '+p.origin+' — this page can only analyze screens on '+location.origin+'. Copy this HTML file into that app\'s assets folder and open it from there.'};
  return p.pathname+p.search+p.hash;
 }catch(e){return '/'+u.replace(/^\/+/,'');}
}
function makeFrame(url){
 return new Promise((resolve,reject)=>{
  const fr=document.createElement('iframe');
  fr.style.cssText='position:fixed;left:-99999px;top:0;width:1440px;height:900px;border:0;background:#fff';
  document.body.appendChild(fr);
  let s1blank=null,done=false;
  setTimeout(()=>{try{const b=fr.contentDocument&&fr.contentDocument.body;if(b){let blocks=0;b.querySelectorAll('*').forEach(e=>{const r=e.getBoundingClientRect();if(r.width>60&&r.height>40)blocks++;});s1blank=(b.innerText||'').trim().length<10&&blocks<3;}}catch(e){}},250);
  const to=setTimeout(()=>{if(done)return;done=true;fr.remove();reject(new Error('The page took too long to load. Check the URL opens normally in a tab.'));},20000);
  fr.addEventListener('load',()=>{
   let href='';try{href=fr.contentWindow.location.href;}catch(e){}
   if(href==='about:blank'||done)return;
   clearTimeout(to);
   setTimeout(()=>{
    if(done)return;done=true;
    try{void fr.contentDocument.body;}catch(e){fr.remove();reject(new Error('Cannot read that page (different address). Serve this file from the same app.'));return;}
    resolve({fr,s1blank:()=>s1blank});
   },1100);
  });
  fr.src=url;
 });
}
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
async function runEmbeddedAudit(){
 const u=normUrl($('embedUrl').value);
 if(!u){showError('Paste the path of the screen to audit, e.g. /trades');return;}
 if(u.err){showError(u.err);return;}
 hideError();
 const btn=$('embedRun');btn.disabled=true;btn.textContent='Analyzing…';
 try{
  if(liveFrame){liveFrame.remove();liveFrame=null;liveFrameReport=null;}
  const {fr,s1blank}=await makeFrame(u);
  const win=fr.contentWindow,doc=fr.contentDocument;
  await sleep(500);
  win.__UXW_RETURN=true;
  win.eval(buildAuditSnippet());
  const res=win.__uxwResult||{issues:[]};
  const extras=[];
  const rules=[];LENSES.forEach(l=>{if(selectedLenses.has(l.id))rules.push(...l.rules);});
  if(s1blank()===true&&rules.includes('S1'))extras.push({ruleId:'S1',message:'Body was essentially empty ~250ms after navigation — no loading state shown.',selector:'',rect:null,data:{}});
  if(rules.includes('A7')){
   fr.style.width='960px';await sleep(450);
   const sw=doc.documentElement.scrollWidth,cw=doc.documentElement.clientWidth;
   if(sw>cw+8)extras.push({ruleId:'A7',message:'Horizontal overflow at 150% zoom: '+sw+'px content in a '+cw+'px viewport',selector:'',rect:null,data:{scrollWidth:sw,clientWidth:cw}});
   fr.style.width='1440px';await sleep(350);
  }
  if(rules.includes('I1')){
   const dlgSel='[role="dialog"],[role="alertdialog"],dialog[open],mat-dialog-container,.cdk-dialog-container,.modal.show,.p-dialog';
   const visD=()=>[...doc.querySelectorAll(dlgSel)].find(d=>{const r=d.getBoundingClientRect();return r.width>0&&r.height>0;});
   let dlg=visD(),opened=false;
   if(!dlg){
    const SAFE=/\b(filter|filters|settings|columns|options|preferences|view|customi[sz]e|more)\b/i;
    const BAD=/\b(submit|send|save|confirm|release|delete|remove|approve|execute|buy|sell|order|pay|apply|cancel order|terminate|revoke)\b/i;
    const op=[...doc.querySelectorAll('button,[role="button"]')].find(b=>{const t=(b.innerText||'')+' '+(b.getAttribute('aria-label')||'');const r=b.getBoundingClientRect();return r.width>0&&SAFE.test(t)&&!BAD.test(t);});
    if(op){op.click();await sleep(850);dlg=visD();opened=!!dlg;}
   }
   if(dlg){
    const kev=(tgt,type)=>tgt.dispatchEvent(new win.KeyboardEvent(type,{key:'Escape',code:'Escape',keyCode:27,which:27,bubbles:true}));
    kev(dlg.querySelector('input,button')||dlg,'keydown');
    kev(doc,'keydown');kev(doc,'keyup');
    await sleep(650);
    if(visD()){
     extras.push({ruleId:'I1',message:'Dialog stayed open after pressing Escape'+(opened?' (opened via a safe button)':''),selector:'',rect:null,data:{}});
     const c=dlg.querySelector('[aria-label*=close i],.close,.btn-close,[class*=close]');if(c)c.click();await sleep(300);
    }
   }
  }
  const pageH=Math.min(Math.max(doc.documentElement.scrollHeight,900),6000);
  const obj={kind:'uxw-audit',rules,url:win.location.href,title:doc.title,timestamp:new Date().toISOString(),
   pageSize:{w:1440,h:pageH},issues:[...(res.issues||[]),...extras]};
  fr.style.cssText='width:1440px;height:'+pageH+'px;border:0;display:block;background:#fff';
  const recents=store.get('recentUrls',[]).filter(x=>x!==u);recents.unshift(u);store.set('recentUrls',recents.slice(0,8));
  ingestAudit(obj);
  liveFrame=fr;liveFrameReport=report;
  renderAudit();
 }catch(e){showError(e.message);const b=$('embedRun');if(b){b.disabled=false;b.textContent='Run audit';}}
}

function ingestAudit(obj){
 const ranLenses=new Set();(obj.rules||[]).forEach(r=>{if(lensOfRule[r])ranLenses.add(lensOfRule[r]);});
 const issues=(obj.issues||[]).map((i,n)=>{
  const meta=RULES[i.ruleId]||{t:i.ruleId,w:'',s:i.severity||'improve'};
  const data=Object.assign({},i.data||{},{selector:(i.data&&i.data.selector)||i.selector||'(page)'});
  return{id:i.ruleId+'-'+(n+1),ruleId:i.ruleId,lens:lensOfRule[i.ruleId]||'usability',severity:meta.s,title:meta.t,why:meta.w,message:i.message||meta.t,selector:i.selector||'',rect:i.rect||null,fixPrompt:fillPrompt(i.ruleId,data)};
 });
 const lenses=LENSES.map(l=>{
  const ran=ranLenses.has(l.id);
  const list=issues.filter(i=>i.lens===l.id);
  const fail=list.filter(i=>i.severity==='fail').length,improve=list.length-fail;
  return{id:l.id,name:l.name,ran,score:ran?Math.max(0,100-fail*PEN.fail-improve*PEN.improve):null,counts:{fail,improve}};
 });
 const active=lenses.filter(l=>l.score!==null);
 const overall=Math.round(active.reduce((s,l)=>s+l.score,0)/(active.length||1));
 report={url:obj.url,title:obj.title,timestamp:obj.timestamp||new Date().toISOString(),pageSize:obj.pageSize||null,overall,lenses,issues,
  partial:active.length<LENSES.length?active.length+' of '+LENSES.length+' categories':null,screenshotData:null};
 const reports=getReports();reports.unshift(report);
 while(reports.length>20)reports.pop();
 if(!store.set('reports',reports)){reports.forEach(r=>{if(r!==report)r.screenshotData=null;});store.set('reports',reports);}
 lensFilter='all';selectedId=null;renderAudit();
}

function renderShot(){
 const wrap=$('shotWrap'),img=$('shotImg'),overlay=$('overlay'),scroll=$('shotScroll');
 overlay.innerHTML='';
 if(liveFrame&&liveFrameReport===report){
  if(img)img.remove();
  if(liveFrame.parentElement!==wrap)wrap.insertBefore(liveFrame,overlay);
  const natural=1440;
  const avail=scroll.clientWidth||800;
  scale=Math.min(1,avail/natural);
  wrap.style.transform='scale('+scale+')';wrap.style.width=natural+'px';wrap.style.height=liveFrame.style.height;
  scroll.style.height=Math.min(parseInt(liveFrame.style.height,10)*scale,innerHeight*0.62)+'px';
  report.issues.filter(i=>i.rect).forEach(issue=>{
   const d=el('div','rect'+(issue.severity==='improve'?' improve':''));
   d.id='rect-'+issue.id;d.title=issue.title;
   d.style.left=(issue.rect.x-3)+'px';d.style.top=(issue.rect.y-3)+'px';
   d.style.width=Math.max(10,issue.rect.w+6)+'px';d.style.height=Math.max(10,issue.rect.h+6)+'px';
   d.addEventListener('click',()=>selectIssue(issue.id));
   overlay.appendChild(d);
  });
  return;
 }
 if(!report.screenshotData){
  scroll.innerHTML='<div class="shot-missing"><strong>Add a screenshot for the visual overlay (optional).</strong><br>On the audited screen press <kbd>Win</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> (or PrtScn), snip the page, then click here and press <kbd>Ctrl</kbd>+<kbd>V</kbd>.</div>';
  scroll.tabIndex=0;scroll.style.cursor='pointer';
  scroll.addEventListener('click',()=>scroll.focus());
  scroll.addEventListener('paste',onShotPaste);
  return;
 }
 img.src=report.screenshotData;
 img.onload=()=>{
  const natural=img.naturalWidth;if(!natural)return;
  const avail=scroll.clientWidth;
  scale=Math.min(1,avail/natural);
  wrap.style.transform='scale('+scale+')';wrap.style.width=natural+'px';
  scroll.style.height=Math.min(img.naturalHeight*scale,innerHeight*0.62)+'px';
  /* rects are in page CSS px — map onto the image via pageSize */
  const k=report.pageSize&&report.pageSize.w?natural/report.pageSize.w:1;
  report.issues.filter(i=>i.rect).forEach(issue=>{
   const d=el('div','rect'+(issue.severity==='improve'?' improve':''));
   d.id='rect-'+issue.id;d.title=issue.title;
   d.style.left=(issue.rect.x*k-3)+'px';d.style.top=(issue.rect.y*k-3)+'px';
   d.style.width=Math.max(10,issue.rect.w*k+6)+'px';d.style.height=Math.max(10,issue.rect.h*k+6)+'px';
   d.addEventListener('click',()=>selectIssue(issue.id));
   overlay.appendChild(d);
  });
 };
}
function onShotPaste(e){
 const items=(e.clipboardData||{}).items||[];
 for(const it of items){
  if(it.type.indexOf('image')!==0)continue;
  const f=it.getAsFile();const rd=new FileReader();
  rd.onload=()=>{
   const im=new Image();
   im.onload=()=>{
    const maxW=1400,s=Math.min(1,maxW/im.width);
    const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    report.screenshotData=cv.toDataURL('image/jpeg',0.72);
    const reports=getReports();
    const idx=reports.findIndex(x=>x.timestamp===report.timestamp&&x.url===report.url);
    if(idx>=0){reports[idx]=report;store.set('reports',reports);}
    renderAudit();
   };
   im.src=rd.result;
  };
  rd.readAsDataURL(f);
  e.preventDefault();return;
 }
}

function buildPatternJson(name,x){
 const lib=getLibrary();const libByTag={};
 if(lib&&lib.components)lib.components.forEach(c=>{if(c.tag)libByTag[c.tag]=c;});
 const z=x.zones||{};
 const regions=['top','left','center','right','bottom'];
 const gridZone=regions.find(r=>z[r]&&z[r].hasGrid)||'center';
 const layout={};
 regions.forEach(r=>{
  const zone=z[r]||{};const components=[];
  (zone.buttons||[]).forEach(label=>components.push({type:'button',label}));
  for(let i=0;i<(zone.searches||0);i++)components.push({type:'search-field'});
  (zone.fields||[]).forEach(label=>components.push({type:'input-field',label}));
  if(x.grid&&r===gridZone)components.unshift({type:'data-grid',columns:x.grid.columnNames||[],columns_visible:x.grid.columnsVisible,row_height_px:x.grid.rowHeight,sticky_header:!!x.grid.stickyHeader,sort_indicators:!!x.grid.sortIndicators,row_selection:x.grid.selectionMode||'none',row_actions:x.grid.rowActions||[]});
  if(x.detailPanel&&x.detailPanel.exists&&r==='right')components.unshift({type:'detail-panel',populated_by:'row selection',sections:x.detailPanel.sections||[]});
  layout[r]={components};
 });
 return JSON.stringify({
  $schema:'ux-workbench-pattern/v1',
  pattern:name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60),
  name,captured_from:x.url||'',captured_on:(x.capturedOn||new Date().toISOString()).slice(0,10),
  copilot_instructions:'This file describes a reference screen layout. When asked to build a screen "like this pattern", recreate this layout EXACTLY: the same regions (top/left/center/right/bottom), the same component types in the same order and placement, and the same grid characteristics (visible column count, row height, sticky header, sort indicators, row selection). Reuse the components listed in components_used where the project already has them. Use the project\'s own design tokens, styling, and real data fields — the labels in this file are examples from the reference screen, not required text.',
  viewport:{width:1440,height:900},
  layout,
  components_used:(x.components||[]).map(c=>({tag:c.tag,count:c.count,in_library:!!libByTag[c.tag],status:libByTag[c.tag]?'in library ✓':'unknown ⚠'})),
  library_guidance:(x.components||[]).filter(c=>libByTag[c.tag]&&libByTag[c.tag].designerNotes&&libByTag[c.tag].designerNotes.useWhen).map(c=>({tag:c.tag,component:libByTag[c.tag].component,use_when:libByTag[c.tag].designerNotes.useWhen}))
 },null,2);
}

  const m=v.measured&&v.measured.root;
  const sw=el('div','v-swatch',c.component);
  if(m){sw.style.background=m.backgroundColor;sw.style.color=m.color;sw.style.borderRadius=m.borderRadius;sw.style.fontSize=m.fontSize;}
  vc.appendChild(sw);
  vc.appendChild(el('div','p-name',v.name));
  if(m)vc.appendChild(el('div','measured','bg '+m.backgroundColor+'\ntext '+m.color+'\nfont '+m.fontSize+' '+m.fontFamily+'\nheight '+m.height+'px · pad '+m.padding+'\nradius '+m.borderRadius));
  row.appendChild(vc);
 });
 card.appendChild(row);
 const notes=c.designerNotes||{useWhen:'',doNotUseFor:'',rules:''};
 const sec=el('div','rev-section');
 const sh=el('h3',null,'Designer notes');sh.appendChild(el('span','req-badge','Preserved on re-sync'));sec.appendChild(sh);
 sec.appendChild(el('p','sec-hint','These feed pattern JSONs (use-when guidance).'));
 const fields={};
 [['useWhen','Use when'],['doNotUseFor','Do not use for'],['rules','Rules']].forEach(([key,label])=>{
  sec.appendChild(el('label','field-label',label));
  const t=el('textarea','text-input');t.style.marginBottom='10px';t.value=notes[key]||'';
  fields[key]=t;sec.appendChild(t);
 });
 const save=el('button','btn-primary','Save notes');
 save.addEventListener('click',()=>{
  c.designerNotes={useWhen:fields.useWhen.value,doNotUseFor:fields.doNotUseFor.value,rules:fields.rules.value};
  store.set('library',lib);
  save.textContent='Saved ✓';setTimeout(()=>{save.textContent='Save notes';},1800);
 });
 sec.appendChild(save);card.appendChild(sec);
 page.appendChild(card);
}
</script>
</body>
